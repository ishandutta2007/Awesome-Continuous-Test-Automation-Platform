<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .glow-pulse-1 {
        animation: pulse1 6s ease-in-out infinite alternate;
      }
      .glow-pulse-2 {
        animation: pulse2 8s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: flowAnimation 25s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 6 6;
        animation: flowRevAnimation 20s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodePing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes flowAnimation {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -200; }
      }
      @keyframes flowRevAnimation {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(1.2) translate(-25px, 25px); opacity: 0.55; }
      }
      @keyframes badgePulse {
        0% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.8)); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g>
    <circle class="glow-pulse-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle class="glow-pulse-2" cx="980" cy="300" r="160" fill="#a855f7" filter="url(#glow-purple)" />
    <circle class="glow-pulse-1" cx="800" cy="90" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glow-cyan)" />
  </g>

  <!-- Dynamic Animated CI/CD Pipeline Circuit Lines (Behind Content) -->
  <g fill="none" stroke-linecap="round" opacity="0.45">
    <path class="dash-flow" d="M -50 70 Q 300 20 600 80 T 1250 50" stroke="#38bdf8" stroke-width="2.5" />
    <path class="dash-flow-rev" d="M -50 350 Q 350 400 700 340 T 1250 370" stroke="#c084fc" stroke-width="2" />
    <path class="dash-flow" d="M 100 420 L 250 290 L 480 320 L 720 280 L 950 360 L 1150 290" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Foreground Main Title & Content (Strictly on top, crystal-clear typography) -->
  <g id="foreground-content">
    <!-- Top Pill / Status Tag -->
    <g transform="translate(600, 78)">
      <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" class="badge-glow" />
      <circle cx="-145" cy="0" r="5" fill="#10b981" />
      <text x="-130" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#38bdf8">CONTINUOUS QUALITY INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" fill="url(#primary-grad)">
      Awesome Continuous Test Automation
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of Enterprise SaaS Clouds, Open-Source Frameworks &amp; AI Quality Gates
    </text>

    <!-- Feature Pillars Cards / Badges (In Foreground, cleanly spaced) -->
    <g transform="translate(180, 240)">
      <!-- Card 1: E2E Cloud Grids -->
      <g transform="translate(0, 0)">
        <rect width="180" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
        <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">⚡ Cloud Test Grids</text>
        <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Real Devices &amp; Browsers</text>
      </g>

      <!-- Card 2: AI Self-Healing -->
      <g transform="translate(220, 0)">
        <rect width="180" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
        <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#818cf8">🤖 AI Self-Healing</text>
        <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Autonomous Locators</text>
      </g>

      <!-- Card 3: CI/CD Quality Gates -->
      <g transform="translate(440, 0)">
        <rect width="180" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
        <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">🚀 CI/CD Pipeline Gates</text>
        <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Zero Flakiness Policies</text>
      </g>

      <!-- Card 4: 100% Open Source -->
      <g transform="translate(660, 0)">
        <rect width="180" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" />
        <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">🌐 Open-Source OSS</text>
        <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Playwright, Cypress, Base</text>
      </g>
    </g>

    <!-- Bottom Metric / Architecture Flow Summary -->
    <g transform="translate(600, 360)">
      <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
        AUTHORING  ➔  AI HEALING  ➔  PARALLEL GRID EXECUTION  ➔  CI/CD QUALITY GATES  ➔  OBSERVABILITY
      </text>
    </g>
  </g>
</svg>